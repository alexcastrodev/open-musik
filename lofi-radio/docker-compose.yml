# Este serviço roda isolado no Raspberry PI 4
services:
  lofi-relay:
    build: .
    image: musik-lofi-relay:latest
    restart: unless-stopped
    network_mode: host
    env_file:
      - ~/icecast/.env
    environment:
      - OPUS_BITRATE=${OPUS_BITRATE:-128k}
    volumes:
      - ./songs:/lofi:ro
